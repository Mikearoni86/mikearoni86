<!-- CRT Screen Effect -->
<div class="crt-overlay"></div>
<div class="crt-scanlines"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.getElementById('crtToggle');
    const crtOverlay = document.querySelector('.crt-overlay');
    const crtScanlines = document.querySelector('.crt-scanlines');
    
    // Check localStorage for saved preference
    const crtEnabled = localStorage.getItem('crtEnabled') !== 'false';
    
    // Initialize
    if (!crtEnabled) {
      document.body.classList.add('crt-off');
      toggle.setAttribute('aria-pressed', 'false');
      toggle.querySelector('.crt-label').textContent = 'CRT FX: OFF';
    }
    
    // Toggle function
    toggle.addEventListener('click', () => {
      const isPressed = toggle.getAttribute('aria-pressed') === 'true';
      
      if (isPressed) {
        // Turn OFF
        document.body.classList.add('crt-off');
        toggle.setAttribute('aria-pressed', 'false');
        toggle.querySelector('.crt-label').textContent = 'CRT FX: OFF';
        localStorage.setItem('crtEnabled', 'false');
      } else {
        // Turn ON
        document.body.classList.remove('crt-off');
        toggle.setAttribute('aria-pressed', 'true');
        toggle.querySelector('.crt-label').textContent = 'CRT FX: ON';
        localStorage.setItem('crtEnabled', 'true');
      }
    });
  });
</script>
